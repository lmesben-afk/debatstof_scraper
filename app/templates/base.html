<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Debatstof-radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <nav class="sidebar">

    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14">
          <circle cx="11" cy="11" r="7" stroke="white" stroke-width="1.7"/>
          <circle cx="11" cy="11" r="2" fill="white"/>
          <line x1="11" y1="2" x2="11" y2="4.5" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="11" y1="17.5" x2="11" y2="20" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="2" y1="11" x2="4.5" y2="11" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="17.5" y1="11" x2="20" y2="11" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="sidebar-logo-text">
        <div class="sidebar-logo-title">Scrabere</div>
        <div class="sidebar-logo-sub">Internt JP-værktøj</div>
      </div>
    </div>

    <ul class="nav-list">
      <li><a href="/" class="nav-item {% if not request.path.startswith('/rss/') %}nav-active{% endif %}" {% if not request.path.startswith('/rss/') %}aria-current="page"{% endif %}>Debatstof</a></li>
      <li><a href="/rss/tv2" class="nav-item {% if nav_active == 'rss-tv2' %}nav-active{% endif %}" {% if nav_active == 'rss-tv2' %}aria-current="page"{% endif %}>TV 2-regionerne</a></li>
      <li><a href="/rss/international" class="nav-item {% if nav_active == 'rss-international' %}nav-active{% endif %}" {% if nav_active == 'rss-international' %}aria-current="page"{% endif %}>Internationale medier</a></li>
    </ul>

  </nav>

  <div class="main-content">
    {% if not request.path.startswith('/rss/') %}
      {% include "debate_nav.html" %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>

</body>
</html>
